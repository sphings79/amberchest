<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="1200" height="860" role="img" aria-label="AmberChest account dialog with the advanced options expanded">
  <title>AmberChest — Account setup with advanced options</title>
  <desc>The account dialog: server details, connection test, and the expanded advanced section with batch size, date filter and the policy for messages deleted on the server.</desc>

  <defs>
    <linearGradient id="accent4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9674ff"/>
      <stop offset="1" stop-color="#6244e2"/>
    </linearGradient>
    <filter id="soft4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="26" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="round4">
      <rect x="0" y="0" width="1200" height="860" rx="14"/>
    </clipPath>
      <clipPath id="tear-dark"><path d="M0 0 L720 0 L720 0 719 18 707 37 711 55 695 73 696 91 687 110 691 128 675 146 675 165 674 183 658 201 662 220 652 238 654 256 640 274 640 293 637 311 625 329 626 348 613 366 615 384 614 403 599 421 598 439 586 457 590 476 587 494 575 512 572 531 571 549 559 567 563 586 546 604 548 622 539 640 543 659 527 677 527 695 526 714 510 732 514 750 504 769 505 787 492 805 492 823 489 842 477 860 L0 860 Z"/></clipPath>
    <clipPath id="tear-light"><path d="M1200 0 L720 0 L720 0 719 18 707 37 711 55 695 73 696 91 687 110 691 128 675 146 675 165 674 183 658 201 662 220 652 238 654 256 640 274 640 293 637 311 625 329 626 348 613 366 615 384 614 403 599 421 598 439 586 457 590 476 587 494 575 512 572 531 571 549 559 567 563 586 546 604 548 622 539 640 543 659 527 677 527 695 526 714 510 732 514 750 504 769 505 787 492 805 492 823 489 842 477 860 L1200 860 Z"/></clipPath>
