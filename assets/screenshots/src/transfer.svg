    <text x="330" y="162" fill="#e8eaf0" font-size="16" font-weight="600">Archiv umziehen — Privat</text>
    <text x="330" y="198" fill="#9aa2b5" font-size="11.5">12.480 Nachrichten, 612 MB. Es wandern die Dateien, nicht der Index —</text>
    <text x="330" y="216" fill="#9aa2b5" font-size="11.5">die Gegenstelle baut ihn aus den Journalen neu auf.</text>
    <text x="330" y="244" fill="#6b7386" font-size="9.5" letter-spacing="0.6">ADRESSE DER GEGENSTELLE</text>
