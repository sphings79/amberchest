<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Mail Archiver moving an archive to another instance">
  <title>Mail Archiver — Archiv umziehen</title>
  <desc>Moving an archive: the files are sent to another instance, which rebuilds its index.</desc>

