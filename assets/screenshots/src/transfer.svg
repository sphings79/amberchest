    <text x="344" y="274" fill="#e8eaf0" font-size="12">http://nas:8484</text>
    <text x="330" y="306" fill="#6b7386" font-size="9.5" letter-spacing="0.6">ZIELKONTO</text>
    <rect x="330" y="314" width="540" height="34" rx="10" fill="#11141b" stroke="#262c3a"/>
    <text x="344" y="336" fill="#e8eaf0" font-size="12">Privat — privat@example.com (0)</text>
    <rect x="330" y="376" width="540" height="122" rx="12" fill="#11141b" stroke="none"/>
    <text x="350" y="402" fill="#9aa2b5" font-size="11.5">Dateien werden übertragen …</text>
