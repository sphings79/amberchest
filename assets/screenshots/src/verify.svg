    <text x="330" y="130" fill="#e8eaf0" font-size="16" font-weight="600">Archiv prüfen — Privat</text>
    <text x="330" y="166" fill="#9aa2b5" font-size="11.5">Liest jede gesicherte Datei und vergleicht sie mit der Prüfsumme vom</text>
    <text x="330" y="184" fill="#9aa2b5" font-size="11.5">Tag der Sicherung. Es wird nichts geändert und nichts gelöscht.</text>
