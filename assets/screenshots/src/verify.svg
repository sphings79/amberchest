<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="AmberChest checking an archive, with three findings">
  <title>AmberChest — Archiv prüfen</title>
  <desc>The archive check: every file against its checksum, and the folders against the server.</desc>

  <defs>
