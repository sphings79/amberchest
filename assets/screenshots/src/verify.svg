    <text x="538" y="424" fill="#f0645a" font-size="13" font-weight="500">1</text>
    <rect x="698" y="384" width="160" height="50" rx="10" fill="#151821" stroke="none"/>
    <text x="712" y="404" fill="#6b7386" font-size="9.5">Auf dem Server</text>
    <text x="712" y="424" fill="#e8eaf0" font-size="13" font-weight="500">12.479</text>
    <text x="350" y="476" fill="#6b7386" font-size="10.5">48,2 MB gelesen</text>
    <rect x="330" y="508" width="540" height="34" rx="9" fill="#11141b" stroke="none"/>
    <text x="350" y="530" fill="#f0645a" font-size="12" font-weight="700">!</text>
    <text x="366" y="530" fill="#9aa2b5" font-size="11">Inhalt verändert · INBOX/2024-01-16_…_Grüße-aus-München.eml</text>
    <rect x="330" y="548" width="540" height="34" rx="9" fill="#11141b" stroke="none"/>
    <text x="350" y="570" fill="#f0645a" font-size="12" font-weight="700">!</text>
    <text x="366" y="570" fill="#9aa2b5" font-size="11">Datei fehlt · INBOX/2024-01-17_…_Rechnung-mit-Anhang.eml</text>
    <rect x="330" y="588" width="540" height="34" rx="9" fill="#11141b" stroke="none"/>
    <text x="350" y="610" fill="#f0645a" font-size="12" font-weight="700">!</text>
    <text x="366" y="610" fill="#9aa2b5" font-size="11">Nicht im Index · INBOX/fremde-datei.eml</text>
    <rect x="660" y="578" width="100" height="34" rx="11" fill="#181c26" stroke="#262c3a"/>
    <text x="676" y="600" fill="#9aa2b5" font-size="12.5" font-weight="500">Schließen</text>
    <rect x="772" y="578" width="168" height="34" rx="11" fill="url(#accent)" stroke="none"/>
    <text x="788" y="600" fill="#fff" font-size="12.5" font-weight="500">Prüfung starten</text>
