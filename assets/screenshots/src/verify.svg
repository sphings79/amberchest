    <text x="712" y="364" fill="#f0645a" font-size="13" font-weight="500">1</text>
    <rect x="350" y="384" width="160" height="50" rx="10" fill="#151821" stroke="none"/>
    <text x="364" y="404" fill="#6b7386" font-size="9.5">Unlesbar</text>
    <text x="364" y="424" fill="#e8eaf0" font-size="13" font-weight="500">0</text>
    <rect x="524" y="384" width="160" height="50" rx="10" fill="#151821" stroke="none"/>
