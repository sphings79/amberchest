<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420" role="img" aria-label="Mail Archiver installer background">
  <title>Mail Archiver — Installer</title>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151821"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9674ff"/>
      <stop offset="1" stop-color="#6244e2"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#9674ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
    <rect width="660" height="420" fill="url(#page)"/>
    <ellipse cx="330" cy="150" rx="360" ry="220" fill="url(#halo)"/>

    <!-- brand -->
    <rect x="286" y="40" width="88" height="88" rx="26" fill="url(#brand)"/>
    <g fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="309" y="66" width="42" height="34" rx="7"/>
      <path d="M309 73l21 14 21-14"/>
    </g>

    <text x="330" y="160" fill="#e8eaf0" font-size="24" font-weight="700" text-anchor="middle">
      Mail Archiver
    </text>
    <text x="330" y="182" fill="#8a91a3" font-size="13" text-anchor="middle">
      The Mail Backup Solution
    </text>

    <!-- drag hint: the icons themselves are placed by the installer -->
    <text x="330" y="212" fill="#6b7386" font-size="12.5" text-anchor="middle">
      Zum Installieren in den Programme-Ordner ziehen
    </text>

    <!-- the arrow points from the app icon to the Applications alias -->
    <g transform="translate(0,4)">
      <path d="M256 300h152" stroke="url(#arrow)" stroke-width="3" stroke-linecap="round"/>
      <path d="M398 291l13 9-13 9" fill="none" stroke="#9674ff" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- placeholder plates behind the two icons, so they sit on something -->
    <rect x="118" y="238" width="124" height="124" rx="26" fill="#1b1f2a" opacity="0.55"/>
    <rect x="418" y="238" width="124" height="124" rx="26" fill="#1b1f2a" opacity="0.55"/>

    <!-- No labels here: Finder draws the icon names itself. -->
  </g>
</svg>
