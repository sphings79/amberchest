appId: eu.sphings.mailarchiver
productName: Mail Archiver
copyright: Copyright © 2026 sphings79

directories:
  output: ../../release
  buildResources: build

# The main process plus its workspace packages; the frontend ships as a
# resource so the embedded server can serve it.
files:
  - dist/**/*
  - package.json
  - '!**/*.map'

extraResources:
  - from: ../web/dist
    to: web

# Workspace packages are symlinked into the root node_modules, so the builder
# has to look there for production dependencies.
# better-sqlite3 is the only native module and ships prebuilt binaries for
# every platform we target, picked at runtime. Rebuilding would only break
# cross-compilation - a Linux build made on macOS cannot run node-gyp.
nodeGypRebuild: false
npmRebuild: false
buildDependenciesFromSource: false

# The prebuilt binaries have to stay outside the asar so they can be loaded.
asarUnpack:
  - "**/node_modules/better-sqlite3/**"

mac:
  category: public.app-category.utilities
  darkModeSupport: true
  minimumSystemVersion: '12.0'
  target:
    - target: dmg
      arch:
        - arm64
  # No paid developer account: the app is signed ad-hoc, which means macOS
  # shows the "unidentified developer" prompt on first launch.
  identity: null
  gatekeeperAssess: false

dmg:
  title: Mail Archiver ${version}
  # background.png and background@2x.png live in build/ and are generated from
  # assets/dmg-background.svg, so the installer window matches the app.
  background: build/background.png
  window:
    width: 660
    height: 420
  iconSize: 108
  iconTextSize: 12
  contents:
    # Positions line up with the two plates drawn in the background.
    - x: 180
      y: 300
      type: file
    - x: 480
      y: 300
      type: link
      path: /Applications

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
  # Without a code signing certificate Windows shows a SmartScreen warning on
  # first run. Nothing to do about that short of buying a certificate.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mail Archiver

linux:
  # The package name is scoped, which Linux cannot use as a binary name.
  executableName: mail-archiver
  # Debian derives the package name from this, so it must not be scoped either.
  artifactName: mail-archiver_${version}_${arch}.${ext}
  maintainer: sphings79 <43515272+sphings79@users.noreply.github.com>
  desktop:
    entry:
      Name: Mail Archiver
      Comment: Back up IMAP mailboxes to plain .eml files
  category: Utility
  synopsis: Archive IMAP mailboxes to local .eml files
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
