name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  desktop:
    name: Desktop (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: --mac
            artifact: macos
          - os: windows-latest
            platform: --win
            artifact: windows
          - os: ubuntu-latest
            platform: --linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      # The main process is not part of the root build, and without it
      # electron-builder packages an app.asar with no entry point.
      - run: npm run build --workspace @amberchest/desktop

      - name: Package
        working-directory: packages/desktop
        # No signing identity anywhere: macOS builds are ad-hoc signed, Windows
        # builds are unsigned. Both work, both show a first-run warning.
        run: npx electron-builder ${{ matrix.platform }} --config electron-builder.yml --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: amberchest-${{ matrix.artifact }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error

  container:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from the tag
        id: meta
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/amberchest:latest
            ghcr.io/${{ github.repository_owner }}/amberchest:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish release
    needs: [desktop, container]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          # Only our own uploads: the build step for the container image adds a
          # .dockerbuild artifact that this job cannot download.
          pattern: amberchest-*
          path: artifacts
          merge-multiple: true

      - name: List what will be attached
        run: ls -lh artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file "$notes" artifacts/*
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes artifacts/*
          fi
