# Minimal Dovecot for development. Plain text auth on port 143, no TLS -
# this is only ever reachable from the local docker network.
log_path = /dev/stdout
info_log_path = /dev/stdout

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

mail_home = /srv/mail/%Lu
mail_location = maildir:~/Maildir
mail_uid = 1000
mail_gid = 1000

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = create
  }
  mailbox Sent {
    special_use = \Sent
    auto = create
  }
  mailbox Trash {
    special_use = \Trash
    auto = create
  }
  mailbox Junk {
    special_use = \Junk
    auto = create
  }
  mailbox Archiv {
    special_use = \Archive
    auto = create
  }
}

passdb {
  driver = static
  args = password=testpass
}

userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%Lu
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

protocols = imap
