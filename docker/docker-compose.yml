# AmberChest, ready to run. Adjust the two passwords and the paths.
services:
  amberchest:
    image: ghcr.io/sphings79/amberchest:latest
    container_name: amberchest
    ports:
      - "8484:8484"
    volumes:
      # Encrypted configuration and the search index.
      - ./config:/config
      # The archive itself: one directory per account.
      - ./archive:/archive
    environment:
      # Unlocks the encrypted configuration on start.
      AMBERCHEST_MASTER_PASSWORD: change-me
      # Password for the web interface. Without it the interface is open to
      # anyone who can reach the port.
      AMBERCHEST_UI_PASSWORD: change-me-too
      # Optional second login that can only read, search and download. Needs
      # the password above and has to differ from it.
      # AMBERCHEST_UI_PASSWORD_READONLY: change-me-three
      # Only if your reverse proxy has a public address: which proxies may
      # tell AmberChest the client address (X-Forwarded-For). Default is
      # private networks, which fits a proxy on the same host or network.
      # AMBERCHEST_TRUSTED_PROXIES: "203.0.113.10"
      # Backup schedule, standard cron syntax. Leave out to disable.
      AMBERCHEST_CRON: "0 3 * * *"
      # Export attachments after every scheduled backup as well.
      AMBERCHEST_CRON_EXPORT_ATTACHMENTS: "false"
      TZ: Europe/Berlin
    restart: unless-stopped
