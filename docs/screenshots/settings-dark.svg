<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="Mail Archiver settings screen">
  <title>Mail Archiver — Settings</title>
  <desc>Settings: archive base folder, language, appearance, accent colours, and the hint about scheduled backups with links to the Docker guide.</desc>

  <defs>
    <linearGradient id="accent5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9674ff"/>
      <stop offset="1" stop-color="#6244e2"/>
