    <rect x="626" y="270" width="318" height="36" rx="11" fill="#1b1f2a" stroke="#262c3a"/>
    <text x="642" y="293" fill="#e8eaf0" font-size="12.5">Dunkel</text>
    <path d="M920 286l5 5 5-5" stroke="#6b7386" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

