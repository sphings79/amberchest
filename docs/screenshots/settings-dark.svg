    <g stroke="#9aa2b5" stroke-width="1.6" fill="none">
      <circle cx="310" cy="476" r="8"/>
      <path d="M310 471v5l3 2" stroke-linecap="round"/>
    </g>
    <g stroke="#e8eaf0" stroke-width="1.5" fill="none">
      <rect x="342" y="462" width="6" height="5"/>
      <rect x="350" y="462" width="6" height="5"/>
      <rect x="346" y="456" width="6" height="5"/>
      <path d="M338 469h22c0 5-4 8-9 8s-13-1-13-8z" stroke-linejoin="round"/>
    </g>
    <text x="370" y="472" fill="#e8eaf0" font-size="13" font-weight="500">Zeitgesteuerte Sicherung</text>
    <text x="342" y="498" fill="#9aa2b5" font-size="11.5">Die Desktop-App sichert auf Knopfdruck. Für regelmäßige, automatische</text>
    <text x="342" y="516" fill="#9aa2b5" font-size="11.5">Sicherungen gibt es den Docker-Container - dort wird der Zeitplan per</text>
    <text x="342" y="534" fill="#9aa2b5" font-size="11.5">Cron-Ausdruck gesetzt.</text>

    <rect x="342" y="552" width="272" height="34" rx="11" fill="url(#accent5)"/>
    <g stroke="#fff" stroke-width="1.5" fill="none" stroke-linejoin="round">
