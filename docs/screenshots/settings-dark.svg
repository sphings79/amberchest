    <rect x="626" y="552" width="168" height="34" rx="11" fill="#1b1f2a" stroke="#262c3a"/>
    <g stroke="#e8eaf0" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
